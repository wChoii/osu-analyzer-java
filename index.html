<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>osu! Analyzer</h1>

    <input type="text" id="username" placeholder="Enter osu! username">

    <button id="analyzeButton">Analyze</button>
    <div id="results">
    <h2>Player Statistics</h2>

    <p>Username: <span id="playerUsername">-</span></p>
    <p>PP: <span id="playerPp">-</span></p>
    <p>Global Rank: <span id="playerRank">-</span></p>
    <p>Accuracy: <span id="playerAccuracy">-</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
